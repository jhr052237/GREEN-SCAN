<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>그린스캔 체험하기</title>
<meta name="description" content="화장품 바코드를 찍으면 비건·친환경 근거와 ESG 확인 점수를 보여주는 그린스캔 체험판">
<meta name="theme-color" content="#EDF2EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/gs.css">
<style>
  body { background: #DDE5DA; }
  .shell { max-width: 480px; margin: 0 auto; min-height: 100vh; background: linear-gradient(180deg, #F1F5EF 0%, #EAF0E8 60%, #E6ECE4 100%); position: relative; padding-bottom: 110px; box-shadow: 0 0 60px rgba(60,92,70,.12); }
  .pad { padding: 0 20px 24px; }
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 16px; background: rgba(241,245,239,.88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .tb-btn { width: 40px; height: 40px; border: 0; cursor: pointer; color: var(--ink); }
  .hscroll { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
  .hscroll::-webkit-scrollbar { display: none; }
  .sel { flex: 1; min-width: 0; height: 44px; border: 0; padding: 0 10px; font-size: 13px; font-family: inherit; color: var(--ink); border-radius: 14px; }
  .btn[disabled] { opacity: .5; cursor: default; }
  #tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom)); width: calc(100% - 28px); max-width: 452px; height: 72px; border-radius: 36px; display: flex; justify-content: space-around; align-items: center; z-index: 40; padding: 0 6px; }
  #tabs a { width: 64px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--mute); text-decoration: none; }
  #tabs a .c { width: 38px; height: 38px; }
  #tabs a.on { color: var(--forest); font-weight: 800; }
  #tabs a.on .c { background: #E3EED6; box-shadow: inset 2px 2px 5px rgba(104,132,108,.25), inset -2px -2px 5px rgba(255,255,255,.85); }
  #tabs a.sc .c { width: 60px; height: 60px; margin-top: -30px; }
  #toast { position: fixed; left: 50%; bottom: 100px; transform: translate(-50%, 20px); background: #1F3B2F; color: #fff; padding: 12px 18px; border-radius: 16px; font-size: 13.5px; opacity: 0; transition: .25s; z-index: 80; max-width: 90vw; pointer-events: none; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #sheet { display: none; position: fixed; inset: 0; z-index: 70; }
  #sheet.on { display: block; }
  .sheet-bg { position: absolute; inset: 0; background: rgba(20,36,28,.35); }
  .sheet-card { position: absolute; left: 50%; transform: translateX(-50%); bottom: 16px; width: calc(100% - 24px); max-width: 456px; padding: 22px 20px 18px; border-radius: 30px; }
  #reader video { object-fit: cover; }
</style>
</head>
<body>
<div class="shell">
  <main id="view" aria-live="polite"></main>
</div>
<nav id="tabs" class="up" aria-label="메뉴">
  <a href="#/home" data-tab="home"><span class="c circ"><svg class="ic" viewBox="0 0 24 24" style="font-size:20px"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg></span>홈</a>
  <a href="#/list" data-tab="list"><span class="c circ"><svg class="ic" viewBox="0 0 24 24" style="font-size:20px"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg></span>제품</a>
  <a href="#/scan" data-tab="scan" class="sc"><span class="c circ lime"><svg class="ic" viewBox="0 0 24 24" style="font-size:28px;color:#fff"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M8 9v6M11 9v6M14 9v6M17 9v6"/></svg></span>스캔</a>
  <a href="#/compare" data-tab="compare"><span class="c circ"><svg class="ic" viewBox="0 0 24 24" style="font-size:20px"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg></span>비교</a>
  <a href="#/my" data-tab="my"><span class="c circ"><svg class="ic" viewBox="0 0 24 24" style="font-size:20px"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></span>MY</a>
</nav>
<div id="toast" role="status"></div>
<div id="sheet"></div>

</html>
